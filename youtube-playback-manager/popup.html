<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Playback Manager</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div>
          <h1>Playback Manager</h1>
          <p id="statusText">Loading...</p>
        </div>
        <label class="switch" title="Enable or disable automatic playback management">
          <input id="enabledToggle" type="checkbox">
          <span class="slider"></span>
        </label>
      </header>

      <section class="state-grid" aria-label="Detected tabs">
        <article class="state-card">
          <span class="label">Music</span>
          <strong id="musicState">Not detected</strong>
          <small id="musicTitle"></small>
        </article>
        <article class="state-card">
          <span class="label">Tutorial</span>
          <strong id="tutorialState">Not detected</strong>
          <small id="tutorialTitle"></small>
        </article>
      </section>

      <section class="actions" aria-label="Controls">
        <button id="rescanButton" type="button">Rescan tabs</button>
        <button id="pauseMusicButton" type="button">Pause music</button>
        <button id="resumeMusicButton" type="button">Resume music</button>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
